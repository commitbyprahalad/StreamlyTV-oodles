<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <!-- Google Analytics (GA4) + Tag Manager -->
    <script src="../js/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="Tizen basic template generated by Tizen Web IDE" />
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../css/streamly-tv.css">
    <link rel="stylesheet" href="../css/PopupManager.css">
    <link rel="stylesheet" href="../css/LoadingManager.css">
    <script type="text/javascript" src="../js/api-config.js"></script>
    <script type="text/javascript" src="../js/PopupManager.js"></script>
    <script type="text/javascript" src="../js/LoadingManager.js"></script>
    <script type="text/javascript" src="../js/auth-session.js"></script>
    <script type="text/javascript" src="../js/geolocation.js"></script>
    <script type="text/javascript" src="login.js"></script>
    <link rel="stylesheet" type="text/css" href="../css/all.min.css" />
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
    <!-- Common widget API -->
    <script language="javascript" type="text/javascript" src="$MANAGER_WIDGET/Common/API/Widget.js"></script>
    <script language="javascript" type="text/javascript" src="$MANAGER_WIDGET/Common/API/TVKeyValue.js"></script>
    <script language="javascript" type="text/javascript" src="$MANAGER_WIDGET/Common/API/Plugin.js"></script>
    <!-- Bootstrap 5.3.3 CSS, bundled locally (same file as the CDN copy) -->
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <title>Login</title>
</head>

<body id="body_wrapper">
    <!-- PopupManager + LoadingManager handle these dynamically -->

    <div class="header-container">
        <img src="../images/streamly logo 5.png" alt="logo" class="logo" style="width: 12%;">
    </div>
    <div class="login-wrapper">
        <div class="container">
            <h2>Log In</h2>
            <h4 class="login-subtitle">Enter the necessary information to Log In</h4>

            <div class="login-split">

                <!-- ═══ Left 50% — Active Form ═══ -->
                <div class="login-form-area">

                    <!-- ── Email Form ── -->
                    <div class="tab-pane active" id="pane-email">
                        <div class="form-group">
                            <label for="username">Email <span>*</span></label>
                            <input type="text" class="form-control login-input" id="username" readonly
                                placeholder="Enter your email" value="">
                        </div>
                        <div class="form-group">
                            <div class="login-input-group">
                                <label for="password">Password <span>*</span></label>
                                <input type="password" class="form-control login-input" id="password" readonly
                                    placeholder="Enter Password" value="">
                                <button type="button" id="eye-toggle" class="eye-toggle-btn" tabindex="0"
                                    aria-label="Toggle password visibility">
                                    <i class="far fa-eye-slash" id="eye-icon"></i>
                                </button>
                            </div>
                        </div>
                        <div class="forgot-password-row">
                            <button type="button" id="remember-me-btn" class="remember-me-btn" role="checkbox"
                                aria-checked="false">
                                <span class="remember-me-box"><i class="fas fa-check"></i></span>
                                <span class="remember-me-text">Remember Me</span>
                            </button>
                            <a href="#" id="forgot-password-link" class="forgot-password-link">Forgot Password?</a>
                        </div>
                        <button type="submit" id="signinbutton" class="btn btn-primary login login-btn">LOG IN</button>
                    </div>

                    <!-- ── Passcode Form ── -->
                    <div class="tab-pane" id="pane-passcode">
                        <div class="form-group">
                            <div class="login-input-group">
                                <label for="passcode-input">Passcode <span>*</span></label>
                                <input type="password" class="form-control login-input" id="passcode-input" readonly
                                    placeholder="Enter Passcode" value="">
                                <button type="button" id="passcode-eye-toggle" class="eye-toggle-btn" tabindex="0"
                                    aria-label="Toggle passcode visibility">
                                    <i class="far fa-eye-slash" id="passcode-eye-icon"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" id="passcode-login-btn" class="btn btn-primary login login-btn">LOG
                            IN</button>
                    </div>

                    <!-- ── QR Form ── -->
                    <!-- QR code expires after 1 minute: the QR blurs with an "Expired"
                         overlay and a Refresh QR Code button replaces the countdown
                         (see login.js). -->
                    <div class="tab-pane" id="pane-qr">
                        <div class="qr-login-container">
                            <div class="qr-code-area" id="qr-code-area" tabindex="0">
                                <img src="../images/qr-placeholder.png" alt="QR Code" class="qr-code-image"
                                    id="qr-code-image"
                                    onerror="this.style.display='none'; document.getElementById('qr-fallback').style.display='flex';">
                                <div id="qr-fallback" class="qr-fallback" style="display:none;">
                                    <i class="fas fa-qrcode qr-icon"></i>
                                    <p class="qr-refresh-text">Scan QR to login</p>
                                </div>
                                <!-- Shown over the blurred QR once the 1-minute countdown ends -->
                                <div class="qr-expired-overlay" id="qr-expired-overlay">
                                    <i class="fas fa-hourglass-end qr-expired-icon"></i>
                                    <p class="qr-expired-title">QR Code Expired</p>
                                </div>
                            </div>
                            <p class="qr-instruction">Scan this QR code with your phone</p>
                            <p class="qr-sub-text">Open your phone camera and scan the code above</p>
                            <p class="qr-countdown-text" id="qr-countdown-text">This code expires in 60s</p>
                            <!-- Replaces the countdown once the code has expired -->
                            <button type="button" class="qr-refresh-btn" id="qr-refresh-btn">
                                <i class="fas fa-redo-alt"></i> Refresh QR Code
                            </button>
                        </div>
                    </div>

                </div>

                <!-- ═══ OR Divider ═══ -->
                <div class="login-divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">OR</span>
                    <div class="divider-line"></div>
                </div>

                <!-- ═══ Right 50% — Tab Buttons ═══ -->
                <div class="login-tab-area">
                    <div class="login-pass-wrap" id="login-pass-wrap">
                        <button class="btn-login-alt" id="tab-btn-passcode" data-tab="passcode">
                            <i class="fas fa-lock login-alt-icon"></i>
                            <span class="login-alt-text">Login with Passcode</span>
                            <i class="fas fa-chevron-right login-alt-arrow"></i>
                        </button>
                    </div>
                    <div class="login-qr-wrap" id="login-qr-wrap">
                        <button class="btn-login-alt" id="tab-btn-qr" data-tab="qr">
                            <i class="fas fa-qrcode login-alt-icon"></i>
                            <span class="login-alt-text">Login with QR</span>
                            <i class="fas fa-chevron-right login-alt-arrow"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ═══ Forgot Password Screen ═══ -->
    <div class="forgot-password-wrapper" id="forgot-password-wrapper" style="display:none;">
        <div class="forgot-password-box">
            <button type="button" id="fp-back-btn" class="fp-back-link" aria-label="Back to login">
                <i class="fas fa-chevron-left"></i> Back to login
            </button>

            <h2 class="fp-title">Forgot Password</h2>
            <p class="fp-subtitle">Enter your email to reset your password.</p>

            <label for="fp-email" class="fp-label">Send reset password link to</label>
            <input type="text" class="form-control fp-input" id="fp-email" readonly
                placeholder="Enter registered email">

            <button type="button" id="fp-submit-btn" class="fp-submit-btn">Reset Password Link</button>
        </div>
    </div>
</body>

</html>
