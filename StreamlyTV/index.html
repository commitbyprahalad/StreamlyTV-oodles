<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <!-- Google Analytics (GA4) + Tag Manager -->
    <script src="js/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="Canvas Clock - Canvas API Tutorial">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- Load required web APIs -->
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>

    <!-- CSS styles -->
    <link rel="stylesheet" type="text/css" href="css/theme.css">
    <link rel="stylesheet" type="text/css" href="css/streamly-tv.css">

    <!-- Page title -->
    <title>Streamly Tv App</title>
</head>

<body>
    <!-- JavaScript for redirection -->
    <script type="text/javascript">
        // Function to initialize the page
        localStorage.removeItem("key");
        var init = function () {
            // Check if email is stored in localStorage
            var device = localStorage.getItem("jwt token");
            var videoScreen = localStorage.getItem("video_screen");
            setTimeout(function () {
                if (device != null) {
                    // User is logged in - redirect to EPG page
                    window.location.href = "../programmeguide/epg.html";
                } else {
                    // User not logged in - show guide
                    window.location.href = "../guide/guide.html";
                }
            }, 3000);
        }
        // Call init function on window load
        window.onload = init;
    </script>

    <!-- JavaScript file for additional functionalities -->
    <script src="js/main.js"></script>

    <div class="container">
        <div class="row">
            <div class="splashImage">
                <img src="../images/background/main-bg.png" class="splash" alt="Background">
            </div>
            <div class="splashImage" id="secondImageContainer" style="display: none;">
                <img src="../images/onboarding_gradient.png" id="secondImage" alt="Onboarding">
            </div>

            <div class="img-container">
                <img src="../images/streamly logo 5.png" class="splashlogo" alt="Streamly Logo">
            </div>
        </div>
    </div>
    <script>
        setTimeout(function () {
            window.document.getElementById('secondImageContainer').style.display = 'block';
        }, 500);
    </script>

</body>

</html>
