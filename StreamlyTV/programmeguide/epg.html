<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Google Analytics (GA4) + Tag Manager -->
  <script src="../js/analytics.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamlyTV - Electronic Program Guide</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="modern-epg.css">
  <link rel="stylesheet" href="epg-react.css">
  <link rel="stylesheet" href="../css/PopupManager.css">
  <link rel="stylesheet" href="../css/LoadingManager.css">
</head>

<body>

  <!--
    GENERATED FILE — edit epg-react/epg.template.html and the React source in
    epg-react/src, then run "npm run build" in epg-react/.
    The guide (header, channels, programmes, programme details) is rendered by
    React into #epg-root; the player below is the unchanged
    modern-epg-player.js (AVPlay + dash.js).
  -->
  <div id="epg-root"></div>

  <div id="player-modal" class="player-modal hidden">
    <!-- Samsung AVPlay surface (primary engine); <video> is the dash.js fallback -->
    <object id="av-player" type="application/avplayer" class="av-player"></object>
    <video id="video-player"></video>
    <img src="../images/streamly logo 5.png" alt="logo" class="player-logo" style="display: none;">

    <div id="player-spinner" class="player-spinner hidden">
      <div class="spinner"></div>
    </div>

    <div id="player-controls" class="player-controls">
      <div class="play-pause-icon">
        <img id="play-icon" src="../images/Icons/play-icon.png" alt="Play">
        <img id="pause-icon" src="../images/Icons/pause-icon.png" alt="Pause" class="hidden">
      </div>
    </div>

    <div id="player-error" class="player-error hidden">
      <p>Technical issue. Please try again later.</p>
      <button id="player-retry">Retry</button>
    </div>

    <!-- Now Playing Info Overlay (UP key) -->
    <div id="now-playing-overlay" class="now-playing-overlay hidden">
      <div class="npo-logo-wrap">
        <img id="npo-channel-logo" src="" alt="Channel" class="npo-channel-logo">
      </div>
      <div class="npo-info">
        <div id="npo-title" class="npo-title">—</div>
        <div id="npo-meta" class="npo-meta"></div>
        <div id="npo-desc" class="npo-desc"></div>
      </div>
    </div>
    <!-- Channel List Overlay (LEFT / RIGHT / CH+ CH- keys while player is active) -->
    <div id="player-channel-list" class="player-ch-list hidden">
      <div class="pch-track" id="pch-track"></div>
    </div>
  </div>

  <!-- Samsung TV web APIs (AVPlay) -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="../js/api-config.js"></script>
  <script src="../js/crash-logger.js"></script>
  <script src="../js/auth-session.js"></script>
  <script src="../js/PopupManager.js"></script>
  <script src="../js/LoadingManager.js"></script>
  <script src="../js/internet-monitor.js"></script>
  <script src="../js/geolocation.js"></script>
  <!-- The player attaches itself to window.EPG; the React guide fills in
       EPG.state / EPG.focus / EPG.network / EPG.utils for it. -->
  <script>window.EPG = window.EPG || {};</script>
  <script src="modern-epg-player.js"></script>
  <!-- dash.js (fallback player) is loaded on demand by modern-epg-player.js -->
  <script id="vite-legacy-polyfill" src="./epg-app/polyfills-legacy-MXKDOyQ8.js"></script>
  <script id="vite-legacy-entry" data-src="./epg-app/index-legacy-BcsivlCv.js">System.import(document.getElementById('vite-legacy-entry').getAttribute('data-src'))</script>
</body>

</html>
